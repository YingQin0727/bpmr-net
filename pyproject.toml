[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpmr-net"
version = "0.1.0"
description = "Boundary-preserving masked multi-receptive residual refinement for sparse-section microstructure reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Ying Qin"},
  {name = "Dawang Zhang"},
  {name = "Yidong Qiao"},
]
keywords = [
  "microstructure reconstruction",
  "Gibbs sampling",
  "porous media",
  "uncertainty",
  "PyTorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/YingQin0727/bpmr-net"
Documentation = "https://github.com/YingQin0727/bpmr-net#readme"
Issues = "https://github.com/YingQin0727/bpmr-net/issues"
Source = "https://github.com/YingQin0727/bpmr-net"

[project.optional-dependencies]
paper = ["matplotlib>=3.8", "pandas>=2.0", "scipy>=1.11", "pillow>=10"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
bpmr-net-demo = "bpmr_net.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
